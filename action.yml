name: Star Track
description:
  Generate an editorial SVG profile with GitHub statistics, selected projects
  and impact ratings.
author: Liuyaowen
branding:
  icon: star
  color: green
inputs:
  github_token:
    description:
      GitHub API token; checkout credentials are used separately for pushing.
    required: true
  config_path:
    description: Optional YAML path. Auto-detects star-track.yml when omitted.
    required: false
  username:
    description:
      GitHub user. Overrides username in YAML; required when YAML does not
      supply it.
    required: false
  scope:
    description:
      personal or all. Overrides YAML; defaults to personal without
      configuration.
    required: false
  readme_path:
    description:
      README path relative to the workspace. Overrides YAML output.readme.
    required: false
  card_title:
    description: Card eyebrow title. Overrides YAML appearance.title.
    required: false
  auto_commit:
    description: Commit and push generated files using checkout credentials.
    required: false
    default: 'true'
outputs:
  stars_count:
    description: Stars across selected public repositories.
  commits_count:
    description: Personal commit contributions in the past 365 days (v2 scope).
  contributions_count:
    description: Personal contributions in the past 365 days.
  issues_count:
    description: Issues by all authors in selected public repositories.
  prs_count:
    description: PRs by all authors in selected public repositories.
  repositories_count:
    description: Selected public repository count, excluding forks by default.
  watchers_count:
    description: Actual repository subscribers, not stars.
  followers_count:
    description: User followers.
  following_count:
    description: Accounts the user follows.
  contributed_to_count:
    description:
      GitHub repositoriesContributedTo count (public, including own
      repositories).
  top_language:
    description: Most frequent repository primary language.
  days_active:
    description: Days since account creation (v2 scope), not days with activity.
  developer_grade:
    description: Open-source impact grade from D- to SSS.
  developer_score:
    description: Open-source impact score, formula v2.
  issue_close_rate:
    description: Closed issues divided by all issues, rounded percentage.
  pr_merge_rate:
    description: Merged PRs divided by all PRs, rounded percentage.
  card_path:
    description: Generated desktop light SVG path relative to workspace.
  stats_path:
    description: Generated statistics JSON path relative to workspace.
  changed:
    description: Whether any generated file or README changed.
  execution_time:
    description:
      Total execution time including rendering and optional push, in seconds.
runs:
  using: node24
  main: dist/index.js
