name: Update Star Track profile
on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: star-track-profile
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate profile
        id: stats
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_path: star-track.yml
      - name: Report
        env:
          GRADE: ${{ steps.stats.outputs.developer_grade }}
          SCORE: ${{ steps.stats.outputs.developer_score }}
          STARS: ${{ steps.stats.outputs.stars_count }}
        run: echo "Star Track — $GRADE / $SCORE points / $STARS stars"
